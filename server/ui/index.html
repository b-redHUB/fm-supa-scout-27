<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM Supa Scout 27</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23143222'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23ffc24b' stroke-width='2.5'/%3E%3Cpath d='M16 3v26M3 16h26' stroke='%23e8eee2' stroke-width='1.5' opacity='.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('ss.theme')) || ''; } catch {}</script>
</head>
<body>
<header class="top">
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#1b3f2b"/><circle cx="16" cy="16" r="7" fill="none" stroke="#ffc24b" stroke-width="2.5"/><path d="M16 3v26M3 16h26" stroke="#e8eee2" stroke-width="1.5" opacity=".5"/></svg>
    Supa Scout <small>FM27</small>
  </div>
  <div class="seg mode" id="mode" role="tablist" aria-label="Page">
    <button data-mode="scout" role="tab">Scout</button><button data-mode="disc" role="tab">Discover</button><button data-mode="club" role="tab">My club</button>
  </div>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Search players, clubs, nations" aria-label="Search" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <div class="spacer"></div>
  <span class="date" id="gameDate"></span>
  <span class="pill" id="live"><i></i><span>Checking for FM27…</span></span>
  <button class="btn primary" id="scanBtn">Scan game</button>
  <button class="btn icon" id="settingsBtn" title="Settings and diagnostics" aria-label="Settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<div class="banner" id="banner"></div>

<div class="main" id="main">
  <aside class="rail" id="rail"></aside>
  <section class="results">
    <div class="bar">
      <span class="count" id="count">No scan yet</span>
      <div class="tabs" id="tabs"></div>
      <div class="spacer"></div>
      <label class="pill">Rate as <select id="role"></select></label>
      <button class="btn" id="exportBtn" title="Download the current list as a spreadsheet">Export CSV</button>
    </div>
    <div class="grid" id="grid" tabindex="0" aria-label="Players">
      <div class="empty" id="empty">
        <h3>Ready when you are</h3>
        <p>Open your FM27 save, then press <b>Scan game</b>. Every player in the database is read straight from the game, including regens and players your scouts haven't seen.</p>
      </div>
    </div>
  </section>
  <section class="club" id="clubPage"></section>
  <section class="club disc" id="discPage"></section>
  <aside class="dossier" id="dossier"></aside>
</div>

<div class="compare" id="compare"></div>
<div class="pop" id="settings"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="scout.js"></script>
<script src="discover.js"></script>
<script src="app.js"></script>
</body>
</html>
